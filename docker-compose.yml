version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookku-app
    ports:
      - "8080:80"
    environment:
      - CI_ENVIRONMENT=development
      - MYSQLHOST=database
      - MYSQLPORT=3306
      - MYSQLDATABASE=bookku
      - MYSQLUSER=root
      - MYSQLPASSWORD=bookku_password
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./writable:/var/www/html/writable
    networks:
      - bookku-network
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: bookku-db
    environment:
      - MYSQL_ROOT_PASSWORD=bookku_password
      - MYSQL_DATABASE=bookku
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db_bookku.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pbookku_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookku-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  bookku-network:
    driver: bridge
